<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>金缮夜馆 · 本地预览</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #142321; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #f3eadb; }
    main { display: grid; gap: 8px; justify-content: center; padding: 8px; }
    header { display: flex; gap: 8px; justify-content: space-between; align-items: center; min-height: 32px; }
    h1 { margin: 0; font-size: 14px; }
    button {
      min-height: 32px; padding: 4px 8px; border: 1px solid #5a7168; border-radius: 6px;
      color: #fff1d6; background: #2d453d; cursor: pointer; font-size: 12px;
    }
    button:focus-visible { outline: 2px solid #f1cb86; outline-offset: 2px; }
    .device {
      width: min(390px, calc(100vw - 16px)); height: min(844px, calc(100dvh - 56px));
      min-height: 380px; border: 1px solid #456459; border-radius: 9px; overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; }
    #error { margin: 0; max-width: min(390px, calc(100vw - 16px)); white-space: pre-wrap; color: #ffb8a3; }
  </style>
  <script src="/preview/game.js" defer></script>
  <script src="/preview/browser.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>金缮夜馆 · 本地预览</h1>
      <button type="button" id="reset-preview">清除预览存档</button>
    </header>
    <div class="device"><canvas id="game" aria-label="金缮夜馆游戏画面"></canvas></div>
    <pre id="error" role="alert" hidden></pre>
  </main>
</body>
</html>
